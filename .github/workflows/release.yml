name: Release pack

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pack
        run: make verify
      - name: Build pack zip
        run: make pack-zip
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
